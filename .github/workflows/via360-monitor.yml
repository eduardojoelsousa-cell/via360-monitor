name: VIA360 - Monitor ferroviario

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: via360-rail-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Comprobar retrasos de trenes
        run: |
          set -euo pipefail

          TOKEN_JSON=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=via360-rail-monitor")

          TOKEN=$(echo "$TOKEN_JSON" | jq -er '.value')

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json" \
            https://via360-ferrocarril.vercel.app/api/push/scan \
            | jq .
